services:
  db:
    image: postgres:16-alpine
    container_name: sidesa-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sidesa_db}
      POSTGRES_USER: ${POSTGRES_USER:-sidesa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sidesa_password}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sidesa} -d ${POSTGRES_DB:-sidesa_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: sidesa-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-sidesa}:${POSTGRES_PASSWORD:-sidesa_password}@db:5432/${POSTGRES_DB:-sidesa_db}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-me-32-chars-minimum}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-SIDESA}
      NEXT_PUBLIC_APP_VERSION: ${NEXT_PUBLIC_APP_VERSION:-1.0.0}
      NEXT_PUBLIC_DESA_NAME: ${NEXT_PUBLIC_DESA_NAME:-Desa Sukamaju}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-5242880}
    volumes:
      - uploads_data:/app/uploads
      - backups_data:/app/backups
    expose:
      - "3000"

  nginx:
    image: nginx:1.27-alpine
    container_name: sidesa-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads_data:/var/www/uploads:ro
      - ./certs:/etc/nginx/certs:ro

volumes:
  db_data:
  uploads_data:
  backups_data:
